services:
  mysql_container:
    container_name: mysql_container
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: linkpulse
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - project
  redis_container:
    container_name: redis_container
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - 6379:6379
    volumes:
      - "redis-data:/data"
    networks:
      - project

volumes:
  mysql-data:
  redis-data:

networks:
  project:
