syntax = "proto3" ;

package link;

option go_package = "linkpulse/internal/pb/link" ;

import "google/protobuf/timestamp.proto" ;

service Link {
  rpc Create(CreateRequest) returns (GetOneResponse) ;
  rpc Update(UpdateRequest) returns (GetOneResponse) ;
  rpc GetAll(GetAllRequest) returns (GetAllResponse) ;
  rpc Delete(DeleteRequest) returns (DeleteResponse) ;

  rpc GetOne(GetOneRequest) returns (GetOneResponse) ;
}

message CreateRequest {
  string                    original_url = 1;
  string                    custom_code  = 2;
  google.protobuf.Timestamp expires_at   = 3;
}

message GetOneResponse {
  uint64                    id           = 1;
  string                    original_url = 2;
  string                    code         = 3;
  string                    short_url    = 4;
  google.protobuf.Timestamp expires_at   = 5;
  google.protobuf.Timestamp created_at   = 6;
}

message UpdateRequest {
  optional string original_url = 1;
  optional string custom_code  = 2;

  google.protobuf.Timestamp expires_at = 3;

  uint64 id = 4;
}

message GetOneRequest {
  uint64 id = 1;
}

message GetAllRequest {

}

message GetAllResponse {
  repeated GetOneResponse links = 1;
}

message DeleteRequest {
  uint64 id = 1;
}

message DeleteResponse {

}